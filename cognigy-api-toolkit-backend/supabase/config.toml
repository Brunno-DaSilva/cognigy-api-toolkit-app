project_id = "cognigy-api-toolkit"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

[functions.cognigy-proxy]
verify_jwt = true

[functions.scraper]
verify_jwt = true

[functions.session-analyzer]
verify_jwt = true

[functions.knowledge-upload]
verify_jwt = true

[functions.kai-evaluator]
verify_jwt = true

[functions.kai-sync-worker]
verify_jwt = true

# Test-only stand-in for a customer source system. Public (no JWT) so the sync
# worker can fetch it as a plain external URL. Serves fixed mock data only.
[functions.kai-mock-source]
verify_jwt = false

[analytics]
enabled = false
